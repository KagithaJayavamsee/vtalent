services:
  - type: web
    name: vtalent
    runtime: python
    buildCommand: pip install -r requirements.txt && python vtalent_site/manage.py collectstatic --noinput
    startCommand: python vtalent_site/manage.py migrate --noinput && gunicorn --chdir vtalent_site vtalent_site.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vtalent-db
          property: connectionString

databases:
  - name: vtalent-db
    databaseName: vtalent
    user: vtalent
    plan: free
